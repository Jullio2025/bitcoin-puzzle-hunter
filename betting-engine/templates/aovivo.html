{% extends "base.html" %}
{% block content %}
<div class="aovivo-head">
  <h1>🔴 Ao vivo</h1>
  <span class="hint" id="live-status">carregando…</span>
</div>
<p class="hint">Atualiza sozinho a cada 60 segundos. Lê de cache compartilhado
— não gasta chamada extra da API a cada refresh.</p>

<div id="live-list"><div class="card"><p class="hint">Buscando jogos ao
vivo…</p></div></div>

<script>
const REFRESH = 60000;
async function carregarAoVivo() {
  const st = document.getElementById("live-status");
  try {
    const r = await fetch("/aovivo.json", {cache: "no-store"});
    const data = await r.json();
    render(data.jogos || []);
    const agora = new Date().toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
    st.textContent = (data.jogos && data.jogos.length
        ? data.jogos.length + " jogo(s) ao vivo" : "nenhum jogo ao vivo agora")
        + " · atualizado " + agora;
  } catch (e) {
    st.textContent = "falha ao atualizar — tentando de novo…";
  }
}
function render(jogos) {
  const box = document.getElementById("live-list");
  if (!jogos.length) {
    box.innerHTML = '<div class="card"><p class="hint">Nenhum jogo rolando '
      + 'neste momento. Volte na hora dos jogos. ⚽</p></div>';
    return;
  }
  // agrupa por país — liga
  const grupos = {};
  for (const j of jogos) {
    const k = (j.country || "") + " — " + (j.league || "");
    (grupos[k] = grupos[k] || {flag: j.flag, jogos: []}).jogos.push(j);
  }
  let html = "";
  for (const [liga, g] of Object.entries(grupos)) {
    html += '<div class="card league-block"><h2 class="league-title">'
      + (g.flag ? '<img class="flag" src="'+g.flag+'" alt="">' : "🏆 ")
      + esc(liga) + '</h2>';
    for (const j of g.jogos) {
      const minuto = j.status === "HT" ? "INT"
        : (j.min != null ? j.min + "'" : (j.status || ""));
      html += '<div class="live-row">'
        + '<span class="live-min">' + esc(minuto) + '</span>'
        + '<span class="live-teams">'
        + '<span class="tm">' + logo(j.hl) + esc(j.home) + '</span>'
        + '<span class="tm">' + logo(j.al) + esc(j.away) + '</span></span>'
        + '<span class="live-score">' + (j.gh ?? 0) + '<br>' + (j.ga ?? 0)
        + '</span></div>';
    }
    html += '</div>';
  }
  box.innerHTML = html;
}
function logo(u){ return u ? '<img class="team-logo" src="'+u+'" alt="" loading="lazy">' : ""; }
function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":s; return d.innerHTML; }

carregarAoVivo();
setInterval(carregarAoVivo, REFRESH);
</script>
{% endblock %}
