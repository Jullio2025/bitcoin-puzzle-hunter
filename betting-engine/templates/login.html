{% extends "base.html" %}
{% block content %}
<div class="hero">
  <h1>CHAPA<span>FUT</span></h1>
  <p class="tagline">Entre na sua conta.</p>
</div>

{% if error %}<div class="error">{{ error }}</div>{% endif %}

<form method="post" action="/login" class="card form-grid auth-card">
  <h2>Entrar</h2>
  <label>Usuário
    <input name="username" autocomplete="username" required autofocus></label>
  <label>Senha
    <input type="password" name="password" autocomplete="current-password" required></label>
  <button type="submit" class="primary">Entrar</button>
  <p class="hint">Não tem conta? <a href="/register">Criar agora</a>.</p>
</form>
{% endblock %}
